<mat-card>
  <mat-card-header>
    <mat-card-title>Performing a request</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-form-field class="example-full-width">
      <mat-label>Leave a comment</mat-label>
      <textarea matInput placeholder="Ex. It makes me feel..."></textarea>
    </mat-form-field>
  </mat-card-content>
  <mat-card-footer>
    <button matButton="filled" (click)="performRequest()">Request!</button>
  </mat-card-footer>
</mat-card>
